upstream qweillo_api {
    ip_hash;
    server api1:3000 max_fails=3 fail_timeout=15s;
    server api2:3000 max_fails=3 fail_timeout=15s;
    keepalive 64;
}

limit_req_zone $binary_remote_addr zone=edge:10m rate=30r/s;


limit_req_status 429;

server {
    listen 8080;
    server_name _;
    server_tokens off;

    include /etc/nginx/security-headers.conf;

    client_max_body_size 6m;
    root /usr/share/nginx/html;
    index index.html;

    location /socket.io/ {
        proxy_pass http://qweillo_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        limit_req zone=edge burst=60 nodelay;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_pass http://qweillo_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/v1/(users/me|guilds/[0-9]+)/?$ {
        limit_req zone=edge burst=60 nodelay;
        client_max_body_size 11m;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_pass http://qweillo_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/v1/channels/[0-9]+/attachments/?$ {
        limit_req zone=edge burst=60 nodelay;
        client_max_body_size 2049m;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_pass http://qweillo_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        proxy_pass http://qweillo_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(metrics|readyz|healthz)$ {
        return 404;
    }


    location /assets/ {
        include /etc/nginx/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-transform" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
