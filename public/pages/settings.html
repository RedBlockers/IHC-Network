<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link href="/style/mainPage.css" rel="stylesheet" />
        <link href="/style/contextMenu.css" rel="stylesheet" />
        <link href="/style/settingsPage.css" rel="stylesheet" />
        <link href="/style/cropper.css" rel="stylesheet" />

        <link
            href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.12/cropper.min.css"
            rel="stylesheet"
        />

        <link
            href="/js/libraries/styled-notifications-master/dist/notifications.css"
            rel="stylesheet"
        />
        <title>NoScord</title>
    </head>
    <body class="bg-dark text-white">
        <input
            type="file"
            id="avatarInput"
            accept="image/*"
            style="display: none"
            hidden
        />
        <button id="closeButton" type="button">
            <svg
                xmlns="http://www.w3.org/2000/svg"
                width="32"
                height="32"
                fill="currentColor"
                class="bi bi-x-circle"
                viewBox="0 0 16 16"
            >
                <path
                    d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16"
                />
                <path
                    d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708"
                />
            </svg>
        </button>

        <div id="settings" class="sidebar container pt-3 px-3">
            <div id="settingsContent">
                <h3>Paramètres utilisateur</h3>
                <button>Mon compte</button>
                <button>Profils utilisateur</button>
                <button>Confidentialité et sécurité</button>
                <button>Gestion du stockage</button>
                <hr />
                <h3>Paramètres de l'application</h3>
                <button>Apparence</button>
                <button>Accessibilité</button>
                <button>Langue</button>
                <button>Avancé</button>
                <button>Notifications</button>
                <button>Voix et vidéo</button>
                <hr />
                <button id="logoutButton">
                    Déconnexion
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="16"
                        height="16"
                        fill="currentColor"
                        class="bi bi-arrow-bar-right"
                        viewBox="0 0 16 16"
                    >
                        <path
                            fill-rule="evenodd"
                            d="M6 8a.5.5 0 0 0 .5.5h5.793l-2.147 2.146a.5.5 0 0 0 .708.708l3-3a.5.5 0 0 0 0-.708l-3-3a.5.5 0 0 0-.708.708L12.293 7.5H6.5A.5.5 0 0 0 6 8m-2.5 7a.5.5 0 0 1-.5-.5v-13a.5.5 0 0 1 1 0v13a.5.5 0 0 1-.5.5"
                        />
                    </svg>
                </button>
            </div>
        </div>
        <div class="main-content">
            <h1 style="font-size: 1.75em">Mon compte</h1>
            <div>
                <div style="width: 660px">
                    <div id="userProfileHeader" class="profile-header"></div>
                    <div id="userProfileInfo" class="profile-info p-3">
                        <div class="user-avatar-section">
                            <div
                                class="avatar-wrapper"
                                onclick="onAvatarClick()"
                            >
                                <img
                                    id="userAvatar"
                                    src="/images/NoScord.jpg"
                                    alt="Avatar"
                                    class="user-avatar"
                                />
                                <div class="avatar-overlay">
                                    <span class="change-icon">
                                        <svg
                                            xmlns="http://www.w3.org/2000/svg"
                                            width="24"
                                            height="24"
                                            viewBox="0 0 24 24"
                                            fill="none"
                                            stroke="currentColor"
                                            stroke-width="2"
                                            stroke-linecap="round"
                                            stroke-linejoin="round"
                                        >
                                            <path d="M12 20h9" />
                                            <path
                                                d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"
                                            />
                                        </svg>
                                    </span>
                                </div>
                            </div>

                            <div class="user-info">
                                <h2 id="username">Nom d'affichage</h2>
                                <p id="userTag">Nom d'utilisateur</p>
                            </div>
                        </div>

                        <div id="accountDetails" class="account-details">
                            <!-- Section Nom d'affichage -->
                            <div class="detail-row">
                                <div class="detail-text">
                                    <h3>Nom d'affichage</h3>
                                    <p>John Doe</p>
                                </div>
                                <div class="action-buttons">
                                    <button class="action-button">
                                        Modifier
                                    </button>
                                </div>
                            </div>

                            <!-- Section Nom d'utilisateur -->
                            <div class="detail-row">
                                <div class="detail-text">
                                    <h3>Nom d'utilisateur</h3>
                                    <p>@johndoe</p>
                                </div>
                                <div class="action-buttons">
                                    <button class="action-button">
                                        Modifier
                                    </button>
                                </div>
                            </div>

                            <!-- Section Email -->
                            <div class="detail-row">
                                <div class="detail-text">
                                    <h3>Adresse email</h3>
                                    <p>john.doe@email.com</p>
                                </div>
                                <div class="action-buttons">
                                    <button class="action-button">
                                        Modifier
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.12/cropper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function onAvatarClick() {
            const avatarInput = document.getElementById("avatarInput");
            avatarInput.click();
        }
    </script>
    <script type="module">
        // Importation du module CropperModal
        import { CropperModal } from "../js/components/cropperModal.js";
        const avatarInput = document.getElementById("avatarInput");
        const avatarImage = document.getElementById("userAvatar");
        const cropperModal = new CropperModal(avatarInput);
        document.addEventListener("onCropperDone", (e) => {
            const { base64, canvas, cropper } = e.detail;
            avatarImage.src = base64;
        });

        // Affichage des éléments dynamiques
        import { getAverageRGB } from "../js/utils/imageUtils.js";

        avatarImage.onload = () => {
            UpdatebannerColor();
        };
        function UpdatebannerColor() {
            const userProfileHeader =
                document.getElementById("userProfileHeader");
            const userProfilePicture = document.getElementById("userAvatar");
            console.log(
                "Calculating average color for:",
                userProfilePicture.src
            );
            const averageColor = getAverageRGB(userProfilePicture);
            userProfileHeader.style.backgroundColor = `rgb(${averageColor.r}, ${averageColor.g}, ${averageColor.b})`;
        }

        UpdatebannerColor();
    </script>
</html>
